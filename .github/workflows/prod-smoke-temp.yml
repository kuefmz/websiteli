name: Temporary Production Smoke

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test production flow
        run: |
          set -euo pipefail
          echo "HEALTH"
          curl -fsSL --max-time 60 https://websiteli.onrender.com/health
          echo
          echo "SCAN"
          SCAN=$(curl -fsSL --max-time 120 \
            -X POST https://websiteli.onrender.com/api/scan \
            -H "Content-Type: application/json" \
            --data '{"url":"https://websiteli.ch"}')
          echo "$SCAN"
          SCAN_ID=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["scanId"])' "$SCAN")
          echo "SCAN_ID=$SCAN_ID"
          echo "EMAIL"
          EMAIL=$(curl -fsSL --max-time 90 \
            -X POST https://websiteli.onrender.com/api/email-report \
            -H "Content-Type: application/json" \
            --data "{\"scanId\":\"$SCAN_ID\",\"email\":\"jenifer.girl.98@gmail.com\",\"consent\":true,\"sourceUrl\":\"https://websiteli.ch/en/market-scan/\",\"language\":\"en\",\"campaign\":\"market-scan-report\",\"metadata\":{\"utm_source\":\"chatgpt-final-prod-check\"}}")
          echo "$EMAIL"
          python -c 'import json,sys; p=json.loads(sys.argv[1]); assert p.get("ok") is True' "$EMAIL"
