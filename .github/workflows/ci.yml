name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify audit and market scan output
        run: |
          test -f dist/audit/index.html
          test -f dist/en/audit/index.html
          test -f dist/de/audit/index.html
          for locale in en de fr it es; do
            test -f "dist/$locale/market-scan/index.html"
            test -f "dist/$locale/blog/free-website-market-scan/index.html"
            grep -q "WebApplication" "dist/$locale/market-scan/index.html"
            grep -q "FAQPage" "dist/$locale/market-scan/index.html"
          done
          grep -q "market-scan-report" dist/en/market-scan/index.html
          grep -R -q "https://websiteli.ch/fr/market-scan/" dist/sitemap-*.xml
          grep -R -q "https://websiteli.ch/es/blog/free-website-market-scan/" dist/sitemap-*.xml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market-scan-api/requirements.txt

      - name: Install Market Scan backend dependencies
        run: pip install -r market-scan-api/requirements.txt

      - name: Validate Market Scan backend
        run: |
          python -m py_compile market-scan-api/main.py
          grep -q "script.google.com/macros/s/" market-scan-api/main.py
          cd market-scan-api
          python -c "import main; assert main.app.title == 'Websiteli Market Scan API'"
          pytest -q

      - name: Temporary production smoke test
        timeout-minutes: 3
        run: |
          set -euo pipefail
          echo "=== Render health ==="
          curl -fsSL --max-time 90 https://websiteli.onrender.com/health
          echo
          echo "=== Apps Script direct execution ==="
          RESPONSE=$(curl -fsSL -L --max-time 60 \
            "https://script.google.com/macros/s/AKfycbxp7Sk0DtUk3wlsrhvzG_XWb_M-ycSDWn7vf2lHCf70PKN2sdtfvaKZYQyHFfEyx7M-/exec" \
            -H "Content-Type: text/plain;charset=utf-8" \
            --data '{"type":"market-scan-execution","scanId":"chatgpt-prod-smoke-20260925","status":"completed","submittedUrl":"https://websiteli.ch","normalizedUrl":"https://websiteli.ch/","elapsedMs":1,"report":{"scannedUrl":"https://websiteli.ch/","brand":"Websiteli","summary":{"pagesCrawled":1,"buyerSignals":0,"competitorCandidates":0,"reviewMentions":0,"priorityActions":0},"website":{"opportunityScore":50}}}')
          echo "$RESPONSE"
          python -c 'import json,sys; p=json.loads(sys.argv[1]); assert p.get("success") is True; assert p.get("type")=="market-scan-execution"; assert p.get("result",{}).get("stored") is True' "$RESPONSE"

          echo "=== Apps Script direct report email ==="
          REPORT_RESPONSE=$(curl -sSL -L --max-time 60 \
            "https://script.google.com/macros/s/AKfycbxp7Sk0DtUk3wlsrhvzG_XWb_M-ycSDWn7vf2lHCf70PKN2sdtfvaKZYQyHFfEyx7M-/exec" \
            -H "Content-Type: text/plain;charset=utf-8" \
            --data '{"type":"market-scan-report","email":"jenifer.girl.98@gmail.com","scanId":"chatgpt-prod-smoke-20260925","campaign":"market-scan-report","sourceUrl":"https://websiteli.ch/en/market-scan/","language":"en","metadata":{"scanId":"chatgpt-prod-smoke-20260925","scannedUrl":"https://websiteli.ch/","reportHtml":"<html><body><h1>Websiteli test report</h1><p>Direct Apps Script email smoke test.</p></body></html>"}}')
          echo "$REPORT_RESPONSE"

          echo "=== Render full scan ==="
          SCAN=$(curl -fsSL --max-time 120 \
            -X POST https://websiteli.onrender.com/api/scan \
            -H "Content-Type: application/json" \
            --data '{"url":"https://websiteli.ch"}')
          echo "$SCAN"
          SCAN_ID=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["scanId"])' "$SCAN")
          echo "SCAN_ID=$SCAN_ID"

          echo "=== Render report email ==="
          EMAIL_RESPONSE=$(curl -fsSL --max-time 90 \
            -X POST https://websiteli.onrender.com/api/email-report \
            -H "Content-Type: application/json" \
            --data "{\"scanId\":\"$SCAN_ID\",\"email\":\"jenifer.girl.98@gmail.com\",\"consent\":true,\"sourceUrl\":\"https://websiteli.ch/en/market-scan/\",\"language\":\"en\",\"campaign\":\"market-scan-report\",\"metadata\":{\"utm_source\":\"chatgpt-prod-smoke\"}}")
          echo "$EMAIL_RESPONSE"
          python -c 'import json,sys; p=json.loads(sys.argv[1]); assert p.get("ok") is True' "$EMAIL_RESPONSE"

      - name: Run live Market Scan classification check
        continue-on-error: true
        timeout-minutes: 3
        run: |
          cd market-scan-api
          python scripts/live_quality_check.py
