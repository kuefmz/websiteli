name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify audit and market scan output
        run: |
          test -f dist/audit/index.html
          test -f dist/en/audit/index.html
          test -f dist/de/audit/index.html
          for locale in en de fr it es; do
            test -f "dist/$locale/market-scan/index.html"
            test -f "dist/$locale/blog/free-website-market-scan/index.html"
            grep -q "WebApplication" "dist/$locale/market-scan/index.html"
            grep -q "FAQPage" "dist/$locale/market-scan/index.html"
          done
          grep -q "market-scan-report" dist/en/market-scan/index.html
          grep -R -q "https://websiteli.ch/fr/market-scan/" dist/sitemap-*.xml
          grep -R -q "https://websiteli.ch/es/blog/free-website-market-scan/" dist/sitemap-*.xml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market-scan-api/requirements.txt

      - name: Install Market Scan backend dependencies
        run: pip install -r market-scan-api/requirements.txt

      - name: Validate Market Scan backend
        run: |
          python -m py_compile market-scan-api/main.py
          grep -q "script.google.com/macros/s/" market-scan-api/main.py
          cd market-scan-api
          python -c "import main; assert main.app.title == 'Websiteli Market Scan API'"
          pytest -q

      - name: Run live Market Scan classification check
        timeout-minutes: 3
        run: |
          cd market-scan-api
          python scripts/live_quality_check.py

      - name: Smoke test Market Scan Google Sheets endpoint
        run: |
          response=$(curl -sS -L --fail-with-body \
            -X POST \
            'https://script.google.com/macros/s/AKfycbxcU1PnJv0YFT7NFI_CnD71NbRl8mAjSljBbZjCqqCXt96bw1lEUlGhbel1-oBm4n-k/exec' \
            -H 'Content-Type: text/plain;charset=utf-8' \
            --data '{"type":"market-scan-execution","scanId":"chatgpt-deployment-smoke-test","status":"completed","submittedUrl":"https://websiteli.ch","normalizedUrl":"https://websiteli.ch/","elapsedMs":1,"report":{"scannedUrl":"https://websiteli.ch/","brand":"Websiteli","elapsedMs":1,"summary":{"pagesCrawled":1,"buyerSignals":0,"reviewMentions":0,"competitorCandidates":0,"priorityActions":0},"website":{"opportunityScore":0},"research":{"queries":{"smokeTest":["deployment verification"]}}}}')
          echo "$response"
          echo "$response" | grep -q '"success":true'
