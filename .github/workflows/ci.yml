name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify audit and market scan output
        run: |
          test -f dist/audit/index.html
          test -f dist/en/audit/index.html
          test -f dist/de/audit/index.html
          test -f dist/en/market-scan/index.html
          test -f dist/de/market-scan/index.html
          grep -q "market-scan-report" dist/en/market-scan/index.html
          grep -q "script.google.com/macros/s/AKfycbyAMZy4vPe56lUmFA8-Q_MDJ-AS4aJJb0vOeiViGPneWtkYn9LKXla2BmSWflsvuE-lyw/exec" dist/en/market-scan/index.html

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market-scan-api/requirements.txt

      - name: Install Market Scan backend dependencies
        run: pip install -r market-scan-api/requirements.txt

      - name: Validate Market Scan backend
        run: |
          python -m py_compile market-scan-api/main.py
          cd market-scan-api
          python -c "import main; assert main.app.title == 'Websiteli Market Scan API'"
          pytest -q

      - name: Run live Market Scan classification check
        timeout-minutes: 3
        run: |
          cd market-scan-api
          python scripts/live_quality_check.py
