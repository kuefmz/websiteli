name: Daily SEO content draft

on:
  schedule:
    # 05:30 UTC = 07:30 in Zurich during summer time.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      content_date:
        description: "Calendar date to generate (YYYY-MM-DD); leave empty for today"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-seo-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's review draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          CONTENT_DATE: ${{ inputs.content_date }}
        run: python scripts/generate_daily_content.py

      - name: Detect generated changes
        id: changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create review pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "content: generate daily SEO draft"
          branch: automation/daily-seo-content
          delete-branch: true
          title: "Daily SEO content draft"
          body: |
            Automatically generated from the approved 30-day SEO content calendar.

            This pull request contains a review draft only. Before merging or moving any copy into the public content registry, verify:

            - factual claims and any `[VERIFY]` placeholders
            - Swiss relevance and pricing statements
            - internal links and CTA destinations
            - German localization where applicable
            - metadata, schema, accessibility, and repository formatting
            - that no client result, testimonial, ranking, or business claim was invented
          labels: |
            content
            automated
          add-paths: |
            content-drafts/**
