  <text x="105" y="316" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">Spend Money on Ads</text>
  <text x="105" y="367" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="27">Fix the conversion path before you pay to send more people through it.</text>

