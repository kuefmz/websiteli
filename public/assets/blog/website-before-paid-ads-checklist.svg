    <rect x="815" y="641" width="295" height="57" rx="17" fill="#ffffff"/><circle cx="850" cy="670" r="15" fill="#dbeafe"/><text x="845" y="677" fill="#17345a" text-anchor="middle">7</text><text x="879" y="677" fill="#0f172a">Tested form</text>
    <rect x="1135" y="641" width="330" height="57" rx="17" fill="#ffffff"/><circle cx="1170" cy="670" r="15" fill="#dbeafe"/><text x="1165" y="677" fill="#17345a" text-anchor="middle">8</text><text x="1199" y="677" fill="#0f172a">Conversion tracking</text>
    <rect x="815" y="713" width="295" height="57" rx="17" fill="#ffffff"/><circle cx="850" cy="742" r="15" fill="#dbeafe"/><text x="845" y="749" fill="#17345a" text-anchor="middle">9</text><text x="879" y="749" fill="#0f172a">Privacy setup</text>
    <rect x="1135" y="713" width="330" height="57" rx="17" fill="#ffffff"/><circle cx="1170" cy="742" r="15" fill="#dbeafe"/><text x="1164" y="749" fill="#17345a" text-anchor="middle">10</text><text x="1199" y="749" fill="#0f172a">Lead follow-up</text>
