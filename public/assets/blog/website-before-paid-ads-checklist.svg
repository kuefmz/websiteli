<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">10 Things Your Small-Business Website Needs Before You Spend Money on Ads</title>
  <desc id="desc">Websiteli checklist title card based on the existing simple blog visual style, with a website preview and ten pre-advertising checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#17345a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#eaf3ff" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07111f" stop-opacity="0"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
