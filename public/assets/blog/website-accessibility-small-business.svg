<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Website Accessibility for Small Businesses: A Practical Checklist</title>
  <desc id="desc">A Websiteli-style website accessibility checklist with readable text, keyboard focus, image alt text and form labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#17345a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.99"/>
      <stop offset="1" stop-color="#eaf3ff" stop-opacity="0.97"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="1390" cy="140" r="220" fill="#5eead4" opacity="0.10"/>
