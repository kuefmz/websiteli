  <text x="110" y="350" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">A Practical Checklist</text>
  <text x="110" y="405" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="28">Make important pages easier to read, navigate and use.</text>
