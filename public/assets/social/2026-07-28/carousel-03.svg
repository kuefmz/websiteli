<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#0f2747"/><text x="80" y="110" fill="#9bd9ff" font-family="Arial" font-size="30" font-weight="700">03 • STRUCTURE</text><text x="80" y="270" fill="#fff" font-family="Arial" font-size="70" font-weight="800">Give every language</text><text x="80" y="355" fill="#fff" font-family="Arial" font-size="70" font-weight="800">a clear home.</text><rect x="80" y="510" width="920" height="360" rx="30" fill="#fff"/><text x="130" y="605" fill="#0f172a" font-family="Arial" font-size="38" font-weight="800">Use predictable paths:</text><text x="130" y="695" fill="#0f766e" font-family="Arial" font-size="48" font-weight="800">/de/  /fr/  /it/  /en/</text><text x="130" y="785" fill="#475569" font-family="Arial" font-size="30">Keep visitors on the equivalent page</text><text x="130" y="830" fill="#475569" font-family="Arial" font-size="30">when they switch language.</text><text x="80" y="1020" fill="#cbd5e1" font-family="Arial" font-size="34">Clear navigation builds trust and</text><text x="80" y="1065" fill="#cbd5e1" font-family="Arial" font-size="34">makes maintenance easier.</text><text x="80" y="1240" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Websiteli • multilingual website strategy</text></svg>