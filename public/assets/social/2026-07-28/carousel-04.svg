<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f8fafc"/><text x="80" y="110" fill="#0f2747" font-family="Arial" font-size="30" font-weight="700">04 • LOCALISE</text><text x="80" y="270" fill="#0f172a" font-family="Arial" font-size="70" font-weight="800">Translate meaning.</text><text x="80" y="355" fill="#0f172a" font-family="Arial" font-size="70" font-weight="800">Not just words.</text><text x="80" y="500" fill="#475569" font-family="Arial" font-size="34">Adapt search wording, tone, service</text><text x="80" y="545" fill="#475569" font-family="Arial" font-size="34">terms and calls to action for each</text><text x="80" y="590" fill="#475569" font-family="Arial" font-size="34">target market.</text><rect x="80" y="730" width="920" height="300" rx="30" fill="#dbeafe"/><text x="130" y="815" fill="#0f172a" font-family="Arial" font-size="36" font-weight="800">Literal translation can be correct</text><text x="130" y="865" fill="#0f172a" font-family="Arial" font-size="36" font-weight="800">and still fail commercially.</text><text x="130" y="955" fill="#0f766e" font-family="Arial" font-size="32" font-weight="700">Write for how customers actually search.</text><text x="80" y="1240" fill="#0f2747" font-family="Arial" font-size="28" font-weight="700">Websiteli • practical multilingual SEO</text></svg>