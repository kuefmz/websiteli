<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#eef6ff"/><text x="80" y="110" fill="#0f2747" font-family="Arial" font-size="30" font-weight="700">02 • START WITH DEMAND</text><text x="80" y="270" fill="#0f172a" font-family="Arial" font-size="70" font-weight="800">Choose languages</text><text x="80" y="355" fill="#0f172a" font-family="Arial" font-size="70" font-weight="800">based on markets.</text><text x="80" y="470" fill="#475569" font-family="Arial" font-size="34">Ask where enquiries come from,</text><text x="80" y="515" fill="#475569" font-family="Arial" font-size="34">which regions you serve and what</text><text x="80" y="560" fill="#475569" font-family="Arial" font-size="34">your team can support well.</text><rect x="80" y="720" width="920" height="330" rx="30" fill="#fff"/><text x="130" y="800" fill="#0f172a" font-family="Arial" font-size="36" font-weight="800">Prioritise:</text><text x="130" y="875" fill="#334155" font-family="Arial" font-size="32">• Existing customer demand</text><text x="130" y="935" fill="#334155" font-family="Arial" font-size="32">• Geographic reach</text><text x="130" y="995" fill="#334155" font-family="Arial" font-size="32">• Team capability</text><text x="80" y="1240" fill="#0f2747" font-family="Arial" font-size="28" font-weight="700">Websiteli • Swiss small-business websites</text></svg>