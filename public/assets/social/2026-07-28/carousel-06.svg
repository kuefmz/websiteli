<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#eef6ff"/><text x="80" y="110" fill="#0f2747" font-family="Arial" font-size="30" font-weight="700">06 • KEEP IT MAINTAINABLE</text><text x="80" y="270" fill="#0f172a" font-family="Arial" font-size="70" font-weight="800">Fewer complete</text><text x="80" y="355" fill="#0f172a" font-family="Arial" font-size="70" font-weight="800">languages beat many</text><text x="80" y="440" fill="#0f172a" font-family="Arial" font-size="70" font-weight="800">outdated ones.</text><rect x="80" y="600" width="920" height="390" rx="30" fill="#fff"/><text x="130" y="690" fill="#0f172a" font-family="Arial" font-size="36" font-weight="800">Create a simple workflow:</text><text x="130" y="770" fill="#334155" font-family="Arial" font-size="31">1. Track every language page</text><text x="130" y="830" fill="#334155" font-family="Arial" font-size="31">2. Keep an approved glossary</text><text x="130" y="890" fill="#334155" font-family="Arial" font-size="31">3. Update all versions together</text><text x="130" y="950" fill="#334155" font-family="Arial" font-size="31">4. Review important pages quarterly</text><text x="80" y="1130" fill="#0f766e" font-family="Arial" font-size="34" font-weight="800">Read the full guide on websiteli.ch</text><text x="80" y="1240" fill="#0f2747" font-family="Arial" font-size="27" font-weight="700">Landing pages from CHF 990 • Growth Setup from CHF 1'990</text></svg>