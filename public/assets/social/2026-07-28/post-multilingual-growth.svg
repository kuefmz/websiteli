<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#0f2747"/><circle cx="910" cy="170" r="220" fill="#5eead4" opacity="0.14"/><text x="80" y="110" fill="#9bd9ff" font-family="Arial" font-size="30" font-weight="700">WEBSITELI</text><text x="80" y="300" fill="#fff" font-family="Arial" font-size="74" font-weight="800">Your next Swiss</text><text x="80" y="390" fill="#fff" font-family="Arial" font-size="74" font-weight="800">market may speak</text><text x="80" y="480" fill="#fff" font-family="Arial" font-size="74" font-weight="800">another language.</text><text x="80" y="620" fill="#cbd5e1" font-family="Arial" font-size="34">A multilingual website should feel local,</text><text x="80" y="665" fill="#cbd5e1" font-family="Arial" font-size="34">consistent and easy to maintain.</text><rect x="80" y="820" width="920" height="170" rx="30" fill="#fff"/><text x="130" y="900" fill="#0f172a" font-family="Arial" font-size="38" font-weight="800">Structure + local intent + human review</text><text x="130" y="950" fill="#0f766e" font-family="Arial" font-size="30" font-weight="700">Read the guide on websiteli.ch</text><text x="80" y="1240" fill="#fff" font-family="Arial" font-size="27" font-weight="700">Swiss small-business websites, automation and AI</text></svg>