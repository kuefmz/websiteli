<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#07111f"/><text x="80" y="110" fill="#9bd9ff" font-family="Arial" font-size="30" font-weight="700">05 • AI + HUMAN REVIEW</text><text x="80" y="270" fill="#fff" font-family="Arial" font-size="70" font-weight="800">Use AI to draft.</text><text x="80" y="355" fill="#fff" font-family="Arial" font-size="70" font-weight="800">Use people to approve.</text><text x="80" y="500" fill="#cbd5e1" font-family="Arial" font-size="34">AI can compare versions, flag gaps</text><text x="80" y="545" fill="#cbd5e1" font-family="Arial" font-size="34">and standardise terminology.</text><rect x="80" y="700" width="920" height="330" rx="30" fill="#fff"/><text x="130" y="790" fill="#0f172a" font-family="Arial" font-size="36" font-weight="800">Always review:</text><text x="130" y="865" fill="#334155" font-family="Arial" font-size="31">• Services and pricing</text><text x="130" y="925" fill="#334155" font-family="Arial" font-size="31">• Legal and trust-critical text</text><text x="130" y="985" fill="#334155" font-family="Arial" font-size="31">• Calls to action and forms</text><text x="80" y="1240" fill="#fff" font-family="Arial" font-size="28" font-weight="700">AI-assisted. Human-approved.</text></svg>